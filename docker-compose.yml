# ============================================================
# Clear Cart — Docker Compose
#
# Tüm gizli değerler .env dosyasından okunur (bkz. .env.example).
# Bu dosyaya ASLA düz metin şifre/token yazmayın.
# ============================================================

services:
  # 🐘 PostgreSQL
  postgres:
    image: ankane/pgvector:latest
    container_name: clearcart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ⚠️ Veritabanı yalnızca docker ağı içinden erişilebilir.
    # Host'tan psql ile bağlanmak için bu satırları geçici olarak açın:
    #   ports:
    #     - "127.0.0.1:5432:5432"
    # (0.0.0.0'a açmayın — veritabanını internete açar.)
    expose:
      - "5432"

  # 🚀 Clear Cart Backend
  backend:
    build: ./backend
    container_name: clearcart-backend
    depends_on:
      - postgres
    volumes:
      - ./backend/keys:/app/keys:ro                # Server key'leri
      - ./backend/client_keys:/app/keys/client_keys  # Kullanıcı özel key'leri
      - ./backend/user_uploads:/app/user_uploads     # Feedback ve görseller
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - ANDROID_CLIENT_ID_FOR_GOOGLE=${ANDROID_CLIENT_ID_FOR_GOOGLE}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - PORT=7860
      - JWT_PRIVATE_KEY_PATH=/app/keys/private.pem
      - JWT_PUBLIC_KEY_PATH=/app/keys/public.pem
      - CLIENT_KEYS_DIR=/app/keys/client_keys       # Kullanıcı key'leri için env değişkeni
    expose:
      - "7860"
    restart: unless-stopped

  ad-b:
    build: ./ad-b
    container_name: clearcart-admin-backend
    depends_on:
      - postgres
    volumes:
    - ./ad-b/product-photos:/app/product-photos
    - ./backend/user_uploads:/app/user_uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      # ⚠️ Admin servisi KENDİ anahtar çiftini kullanır (imaj build'inde üretilir).
      # backend/keys buraya mount EDİLMEMELİDİR — aynı anahtar paylaşılırsa
      # sıradan bir kullanıcı token'ı admin uçlarında da geçerli imzaya sahip olur.
      - JWT_PRIVATE_KEY_PATH=/app/keys/private.pem
      - JWT_PUBLIC_KEY_PATH=/app/keys/public.pem
      - CLIENT_KEYS_DIR=/app/keys/client_keys
      - PORT=10031
    expose:
      - "10031"
    restart: unless-stopped

   # 🚇 NGROK Tunnel (backend'e tünel açar)

  ngrok:
    image: ngrok/ngrok:latest
    container_name: clearcart-ngrok
    depends_on:
      - backend
      - nginx # Nginx'i de buraya ekleyelim, çünkü tünel Nginx'e gidiyor.
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: ["http", "clearcart-nginx:80"] # Tünel Nginx Reverse Proxy'ye gidiyor
    restart: unless-stopped

  # 🌐 Nginx Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: clearcart-nginx
    depends_on:
      - backend
      - ad-b
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/conf.d/.htpasswd:ro
    restart: unless-stopped

volumes:
  postgres_data:
