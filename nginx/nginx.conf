server {
    listen 80;
    client_max_body_size 50M;
    location / {
        proxy_pass http://clearcart-backend:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # /products/image-search barkod okuma, arka plan kaldırma ve ONNX
        # çıkarımı yapıyor; varsayılan 60 sn timeout yetmiyor ve 504 dönüyordu.
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /admin/ {
        auth_basic "ClearCart Yonetici Girisi";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

        proxy_pass http://ad-b:10031;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
    
    location /product-photos/ {
        proxy_pass http://ad-b:10031;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
